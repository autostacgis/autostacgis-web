name: desktop
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: autostacgis-web
    steps:
      - uses: actions/checkout@v4
        with:
          path: autostacgis-web
          submodules: recursive
      - uses: actions/checkout@v4
        with: {repository: autostacgis/autostacgis-python, path: autostacgis-python}
      - uses: actions/checkout@v4
        with: {repository: autostacgis/autostacgis-plugins, path: autostacgis-plugins}
      - uses: actions/checkout@v4
        with: {repository: autostacgis/autostacgis-postgresql, path: autostacgis-postgresql}
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm, cache-dependency-path: autostacgis-web/package-lock.json}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install build
      - run: npm ci
      - run: npm test
      - run: npm run format:check
      - run: npm run dist -- --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Verify native embedded backend and persistent restart
        run: node scripts/smoke-embedded.mjs
      - name: Verify plugins and strict metadata
        run: node scripts/smoke-plugins.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: autostacgis-${{ matrix.os }}
          path: autostacgis-web/release/*
