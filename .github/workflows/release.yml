name: Desktop release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: autostacgis-web
    steps:
      - uses: actions/checkout@v4
        with: {path: autostacgis-web, submodules: recursive}
      - uses: actions/checkout@v4
        with: {repository: autostacgis/autostacgis-python, path: autostacgis-python}
      - uses: actions/checkout@v4
        with: {repository: autostacgis/autostacgis-plugins, path: autostacgis-plugins}
      - uses: actions/checkout@v4
        with: {repository: autostacgis/autostacgis-postgresql, path: autostacgis-postgresql}
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm, cache-dependency-path: autostacgis-web/package-lock.json}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install build
      - run: npm ci
      - run: npm test
      - run: npm run dist -- --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ runner.os == 'macOS' && secrets.MAC_CSC_LINK || runner.os == 'Windows' && secrets.WIN_CSC_LINK || '' }}
          CSC_KEY_PASSWORD: ${{ runner.os == 'macOS' && secrets.MAC_CSC_KEY_PASSWORD || runner.os == 'Windows' && secrets.WIN_CSC_KEY_PASSWORD || '' }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
